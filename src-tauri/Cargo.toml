[package]
name = "miydisk-desktop"
version = "0.1.0"
edition = "2021"
description = "MiYDisk 桌面应用壳（Tauri）"
license = "GPL-3.0-or-later"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
trash = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
miydisk = { path = ".." }

[[bin]]
name = "miydisk-desktop"
path = "src/main.rs"
